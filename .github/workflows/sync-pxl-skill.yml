name: Sync pxl skill from augusto-scarvalho/claude-pxl

on:
  schedule:
    - cron: "47 3 * * 1"   # Mondays 03:47 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy skill from upstream
        # Kept under skills/pxl-pixel-art/: claude.ai rejects plugins with a top-level bin/.
        # docs/ (gallery GIFs), test/ and dev scripts are left out.
        run: |
          git clone --depth 1 https://github.com/augusto-scarvalho/claude-pxl.git /tmp/upstream
          dst=plugins/pxl/skills/pxl-pixel-art
          rm -rf "$dst"
          mkdir -p "$dst"
          for f in SKILL.md LICENSE package.json characters.md environment.md scenes.md reference.md lighting.md rotation.md bin src types examples; do
            cp -r "/tmp/upstream/$f" "$dst/"
          done
          cp /tmp/upstream/LICENSE plugins/pxl/LICENSE
          git -C /tmp/upstream rev-parse HEAD > plugins/pxl/UPSTREAM_COMMIT
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain plugins/pxl)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugins/pxl
            git commit -m "chore(pxl): sync skill from augusto-scarvalho/claude-pxl $(cut -c1-12 plugins/pxl/UPSTREAM_COMMIT)"
            git push
          fi

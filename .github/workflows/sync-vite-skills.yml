name: Sync Vite skills from antfu/skills

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy skills from upstream
        run: |
          git clone --depth 1 https://github.com/antfu/skills.git /tmp/upstream
          for s in vite vitest pnpm; do
            rm -rf "plugins/vite/skills/$s"
            cp -r "/tmp/upstream/skills/$s" plugins/vite/skills/
          done
          cp /tmp/upstream/LICENSE.md plugins/vite/LICENSE.md
          git -C /tmp/upstream rev-parse HEAD > plugins/vite/UPSTREAM_COMMIT
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain plugins/vite)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugins/vite
            git commit -m "chore(vite): sync skills from antfu/skills $(cut -c1-12 plugins/vite/UPSTREAM_COMMIT)"
            git push
          fi

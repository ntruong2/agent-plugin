name: Sync Graphify skill from Graphify-Labs/graphify

on:
  schedule:
    - cron: "37 3 * * 1"   # Mondays 03:37 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy skill from upstream
        run: |
          git clone --depth 1 https://github.com/Graphify-Labs/graphify.git /tmp/upstream
          rm -rf plugins/graphify/skills/graphify
          mkdir -p plugins/graphify/skills/graphify
          cp /tmp/upstream/graphify/skill.md plugins/graphify/skills/graphify/SKILL.md
          cp -r /tmp/upstream/graphify/skills/claude/references plugins/graphify/skills/graphify/
          cp /tmp/upstream/LICENSE /tmp/upstream/LICENSE-MIT /tmp/upstream/NOTICE plugins/graphify/
          git -C /tmp/upstream rev-parse HEAD > plugins/graphify/UPSTREAM_COMMIT
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain plugins/graphify)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugins/graphify
            git commit -m "chore(graphify): sync skill from Graphify-Labs/graphify $(cut -c1-12 plugins/graphify/UPSTREAM_COMMIT)"
            git push
          fi
